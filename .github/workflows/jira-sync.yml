name: Jira Auto Sync

# Manual check only. Disney Jira is not reachable from GitHub cloud runners.
# For automatic updates use ./scripts/install-macos-sync-agent.sh (VPN) or a self-hosted runner.

on:
  workflow_dispatch:

concurrency:
  group: jira-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight — can this runner reach Disney Jira?
        env:
          JIRA_SERVER: ${{ secrets.JIRA_SERVER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: |
          SERVER="${JIRA_SERVER:-https://jira.disney.com}"
          SERVER="${SERVER%/}"
          if [ -z "$JIRA_TOKEN" ]; then
            echo "::error::JIRA_TOKEN secret is not set. Add it under Settings → Secrets → Actions."
            exit 1
          fi
          BODY_FILE="$(mktemp)"
          HTTP_CODE=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" \
            -H "Authorization: Bearer $JIRA_TOKEN" \
            -H "Accept: application/json" \
            "$SERVER/rest/api/2/myself" || echo "000")
          if [ "$HTTP_CODE" = "200" ] && head -c 1 "$BODY_FILE" | grep -q '{'; then
            echo "Jira API is reachable from this runner."
            exit 0
          fi
          echo "::error::Disney Jira is not reachable from GitHub cloud (HTTP $HTTP_CODE). Jobs stay queued only when using self-hosted without a runner online. Use ./scripts/local-auto-sync.sh on VPN or install a self-hosted runner — see docs/SELF-HOSTED-RUNNER.md"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sync dependencies
        run: pip install -r requirements-sync.txt

      - name: Sync from Jira
        env:
          JIRA_SERVER: ${{ secrets.JIRA_SERVER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python scripts/sync-from-jira.py

      - name: Commit and push synced data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/data.json shared/data.js index.html
          if git diff --staged --quiet; then
            echo "No Jira data changes to publish."
            exit 0
          fi
          git commit -m "Auto-sync Jira test plan data (RIGHTS-28225, RIGHTS-28094, RIGHTS-28328)"
          git push
