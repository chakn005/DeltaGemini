name: Jira Auto Sync

on:
  schedule:
    # Every 6 hours (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: jira-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sync.txt

      - name: Install sync dependencies
        run: pip install -r requirements-sync.txt

      - name: Sync from Jira
        env:
          JIRA_SERVER: ${{ secrets.JIRA_SERVER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python scripts/sync-from-jira.py

      - name: Commit and push synced data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/data.json shared/data.js index.html
          if git diff --staged --quiet; then
            echo "No Jira data changes to publish."
            exit 0
          fi
          git commit -m "$(cat <<EOF
Auto-sync Jira test plan data.

Scheduled refresh of RIGHTS-28225, RIGHTS-28094, and RIGHTS-28328 metrics for the GitHub Pages console.
EOF
)"
          git push
