name: Jira Auto Sync (self-hosted)

# Runs only when a self-hosted runner is registered and online on your Mac (VPN).
# If no runner is installed, do not use this workflow — use install-macos-sync-agent.sh instead.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: jira-sync-self-hosted
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sync dependencies
        run: python3 -m pip install -r requirements-sync.txt

      - name: Sync from Jira
        env:
          JIRA_SERVER: ${{ secrets.JIRA_SERVER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python3 scripts/sync-from-jira.py

      - name: Commit and push synced data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/data.json shared/data.js index.html
          if git diff --staged --quiet; then
            echo "No Jira data changes to publish."
            exit 0
          fi
          git commit -m "Auto-sync Jira test plan data (RIGHTS-28225, RIGHTS-28094, RIGHTS-28328)"
          git push
