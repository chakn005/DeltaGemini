<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option 5 — Executive Briefing | Delta Gemini QA</title>
  <style>
    :root { --accent: var(--disney-blue); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--disney-bg); color: var(--disney-text); line-height: 1.5; }
    .disney-header .date { font-size: 0.9rem; color: var(--disney-muted); font-family: inherit; }
    .toolbar { text-align: right; padding: 0.75rem 2rem; background: var(--surface); border-bottom: 1px solid var(--border); }
    .toolbar button { background: var(--disney-blue); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .disney-main { max-width: 900px; background: var(--surface); min-height: 60vh; box-shadow: 0 0 20px rgba(10, 42, 102, 0.06); border: 1px solid var(--border); border-radius: 0 0 12px 12px; }
    .flow-diagram { border: 1px solid var(--border); padding: 1.5rem; margin-bottom: 1.5rem; border-radius: 10px; background: var(--surface); }
    .flow-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .flow-step { text-align: center; flex: 1; min-width: 90px; position: relative; }
    .flow-step .num { width: 28px; height: 28px; background: var(--disney-blue); color: #fff; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; }
    .flow-step h4 { font-size: 0.8rem; font-weight: 600; color: var(--disney-blue); }
    .flow-step p { font-size: 0.7rem; color: var(--muted); }
    .scorecard { font-family: inherit; }
    .readiness { text-align: center; padding: 1.5rem; border: 2px solid var(--border); margin-bottom: 1.5rem; border-radius: 10px; background: var(--disney-blue-soft); }
    .readiness .status { font-size: 1.75rem; font-weight: 600; color: var(--disney-blue); }
    .readiness p { color: var(--muted); font-size: 0.9rem; margin-top: 0.35rem; }
    .score-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .score-table th, .score-table td { padding: 0.65rem 0.85rem; border: 1px solid var(--border); text-align: left; }
    .score-table th { background: var(--disney-blue-soft); color: var(--disney-blue); font-weight: 600; }
    .brief-section { margin-bottom: 1.75rem; }
    .brief-section h2 { font-size: 1.15rem; color: var(--disney-blue); margin-bottom: 0.65rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; }
    .brief-section p, .brief-section li { font-size: 0.95rem; color: var(--text); }
    .brief-section ul { margin-left: 1.5rem; margin-top: 0.5rem; }
    .compare { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .compare th, .compare td { padding: 0.5rem 0.75rem; border: 1px solid var(--border); }
    @media print { .disney-tabs, .toolbar, .hub { display: none; } .disney-main { box-shadow: none; border: none; } }
  </style>
  <link rel="stylesheet" href="../shared/disney-theme.css">
  <link rel="stylesheet" href="../shared/option-layout.css">
  <link rel="stylesheet" href="../shared/integration.css">
  <link rel="stylesheet" href="../shared/jira.css">
</head>
<body>
  <header class="disney-header">
    <a class="hub" href="../index.html">← All options</a>
    <h1>Delta Gemini — QA Leadership Brief</h1>
    <div class="date">May 2026 · Program Readiness Review · <span id="jira-meta"></span></div>
  </header>
  <nav class="disney-tabs" id="tabs">
    <button class="active" data-tab="flow">Flow</button>
    <button data-tab="qa">Coverage</button>
    <button data-tab="ops">Operations</button>
  </nav>
  <div class="toolbar"><button onclick="window.print()">Print / Export</button></div>
  <main class="disney-main" id="app">
    <section class="panel active" data-panel="flow">
      <div class="flow-diagram" id="flow-diagram"></div>
      <h3 class="cpd-section-title">CPD Application Integration Map</h3>
      <div class="flow-diagram" id="int-diagram"></div>
    </section>
    <section class="panel scorecard" data-panel="qa">
      <div class="readiness" id="readiness"></div>
      <table class="score-table" id="plan-table"></table>
      <h3 class="section-title">CPD Integration Coverage</h3>
      <table class="score-table" id="int-table"></table>
      <h3 class="section-title">Integration QA Matrix</h3>
      <div id="int-matrix"></div>
      <h3 class="section-title">Coverage by Application</h3>
      <div class="matrix-wrap"><table class="matrix" id="step-grid"></table></div>
    </section>
    <section class="panel" data-panel="ops">
      <div id="ops-brief"></div>
    </section>
  </main>
  <script src="../shared/data.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="../shared/jira.js"></script>
  <script src="../shared/metrics.js"></script>
  <script src="../shared/matrix-store.js"></script>
  <script src="../shared/integration.js"></script>
  <script>
    const numbered = [
      { id: "rightsline", num: 1 }, { id: "md", num: 2 }, { id: "fda", num: 3 },
      { id: "cpm", num: 4, sub: true }, { id: "xavier", num: 4, sub: true },
      { id: "falcon", num: 5 }, { id: "streaming", num: 6 }
    ];

    function renderFlow() {
      document.getElementById("flow-diagram").innerHTML = `
        <div class="flow-row">${numbered.filter((n) => !n.sub).map((n, i, arr) => {
          const s = stepById(n.id);
          return `<div class="flow-step"><div class="num">${n.num}</div><h4>${escapeHtml(s.name)}</h4><p>${escapeHtml(s.short)}</p></div>${i < arr.length - 1 ? '<span style="color:var(--muted)">→</span>' : ""}`;
        }).join("")}</div>
        <p style="font-size:0.8rem;color:var(--muted);text-align:center">Steps 4a/4b: CPM (metadata) and Xavier (picture versions) branch from FDA</p>`;
      document.getElementById("int-diagram").innerHTML = GEMINI_DATA.cpdIntegrations.map((int, i) => {
        const st = GEMINI_DATA.statusLabels[int.status];
        return `${i ? '<p style="text-align:center;color:var(--muted);margin:0.35rem 0">↓</p>' : ""}
          <div style="display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;border-bottom:1px solid var(--border);font-size:0.85rem">
            <span><strong>${escapeHtml(integrationLabel(int))}</strong> — ${escapeHtml(int.label)}</span>
            <span class="${st.class}">${statusLabel(int.status)} · ${int.coverage}%</span>
          </div>`;
      }).join("");
    }

    function renderQA() {
      const cov = overallCoverage();
      const readiness = cov >= 70 ? "Ready" : cov >= 40 ? "At Risk" : "Not Started";
      const rColor = cov >= 70 ? "var(--completed)" : cov >= 40 ? "var(--progress)" : "var(--pending)";
      document.getElementById("readiness").innerHTML = `<div class="status" style="color:${rColor}">${readiness}</div><p>Application QA: ${cov}% · Integration QA: ${overallIntegrationCoverage()}% · ${totalBlockers()} open blockers · Env: ${GEMINI_DATA.env}</p>`;
      document.getElementById("plan-table").innerHTML = `<tr><th>Test Plan</th><th>Jira</th><th>Status</th><th>Coverage</th><th>Pass/Fail/Blocked</th></tr>
        ${GEMINI_DATA.testPlans.map((p) => `<tr><td>${escapeHtml(p.name)}</td><td>${jiraLink(p.id, p.id)}</td><td>${escapeHtml(p.jiraStatus || GEMINI_DATA.statusLabels[p.status].label)}</td><td>${p.coverage}%</td><td>${p.pass}/${p.fail}/${p.blocked} (total ${p.total})</td></tr>`).join("")}`;
      document.getElementById("int-table").innerHTML = `<tr><th>Integration</th><th>Payload</th><th>Status</th><th>Coverage</th><th>Plan</th></tr>
        ${GEMINI_DATA.cpdIntegrations.map((int) => `<tr><td>${escapeHtml(integrationLabel(int))}</td><td>${escapeHtml(int.payload)}</td><td>${statusLabel(int.status)}</td><td>${int.coverage}%</td><td>${jiraLink(int.testPlan, int.testPlan)}</td></tr>`).join("")}`;
      renderIntegrationMatrixEditable("int-matrix", "int-kpis");
      document.getElementById("step-grid").innerHTML = renderApplicationMatrixTable();
    }

    function renderOps() {
      document.getElementById("ops-brief").innerHTML = `
        <div class="brief-section"><h2>1. Program Context</h2>
        <p>Delta Gemini extends the content pipeline for Hulu licensee deals. QA validates new Hulu CP ID handling, fleet configuration, Kafka topics, and streaming ingestion while reusing most Disney+ logic.</p></div>
        <div class="brief-section"><h2>2. Example Scenarios</h2>
        <ul>${GEMINI_DATA.examples.map((e) => `<li><strong>${escapeHtml(e.title)}</strong> (${escapeHtml(e.type)}) — ${escapeHtml(e.details)}</li>`).join("")}</ul></div>
        <div class="brief-section"><h2>3. CPD Integration Handoffs</h2>
        <table class="compare"><tr><th>Integration</th><th>Owner</th><th>Status</th><th>Coverage</th></tr>
        ${GEMINI_DATA.cpdIntegrations.map((int) => `<tr><td>${escapeHtml(integrationLabel(int))} — ${escapeHtml(int.label)}</td><td>${escapeHtml(int.owner)}</td><td>${statusLabel(int.status)}</td><td>${int.coverage}%</td></tr>`).join("")}
        </table></div>
        <div class="brief-section"><h2>4. Gemini vs Disney+</h2>
        <table class="compare"><tr><th>Area</th><th>Disney+</th><th>Delta Gemini</th></tr>
        ${GEMINI_DATA.geminiVsDisney.map((r) => `<tr><td>${escapeHtml(r.area)}</td><td>${escapeHtml(r.disney)}</td><td style="color:var(--red);font-weight:600">${escapeHtml(r.gemini)}</td></tr>`).join("")}
        </table></div>
        <div class="brief-section"><h2>5. Risks &amp; Mitigations</h2>
        <ul>${GEMINI_DATA.risks.map((r) => `<li>${escapeHtml(r)}</li>`).join("")}</ul></div>
        <div class="brief-section"><h2>6. Contacts</h2>
        <ul>${GEMINI_DATA.contacts.map((c) => `<li><strong>${escapeHtml(c.system)}:</strong> ${escapeHtml(c.owners)}</li>`).join("")}</ul></div>`;
    }

    document.getElementById("tabs").querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b === btn));
        document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.dataset.panel === btn.dataset.tab));
      });
    });

    bootConsole(() => {
      renderFlow();
      renderQA();
      renderOps();
      document.getElementById("jira-meta").innerHTML = GEMINI_DATA.testPlans.map((p) => jiraLink(p.id, p.id)).join(" · ");
    });
  </script>
</body>
</html>
