<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option 2 — Command Center | Delta Gemini QA</title>
  <style>
    :root { --card: var(--disney-surface); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    header h1::before { content: ""; }
    .meta { font-size: 0.75rem; color: var(--muted); font-family: inherit; }
    main { padding: 1.25rem; max-width: 1100px; margin: 0 auto; }
    .panel { display: none; } .panel.active { display: block; }
    .health-strip { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.25rem; font-size: 0.75rem; }
    .health-strip span { padding: 0.35rem 0.65rem; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); font-weight: 600; }
    .health-strip .ok { border-color: var(--completed); color: var(--completed); background: var(--disney-completed-bg); }
    .health-strip .warn { border-color: var(--progress); color: var(--progress); background: var(--disney-progress-bg); }
    .health-strip .pend { border-color: var(--pending); color: var(--pending); background: var(--disney-pending-bg); }
    .flow-layout { display: grid; grid-template-columns: 220px 1fr; gap: 1rem; min-height: 400px; }
    .pipeline { display: flex; flex-direction: column; gap: 0.5rem; }
    .pipe-node { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.65rem 0.75rem; cursor: pointer; font-size: 0.8rem; transition: border-color 0.15s; }
    .pipe-node:hover, .pipe-node.active { border-color: var(--accent); box-shadow: 0 2px 8px rgba(10, 42, 102, 0.08); }
    .pipe-node .nm { font-weight: 600; color: var(--disney-blue); }
    .detail-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; font-size: 0.85rem; line-height: 1.6; }
    .detail-box h3 { color: var(--disney-blue); margin-bottom: 0.5rem; font-size: 0.95rem; }
    .detail-box ul { margin-left: 1rem; color: var(--muted); }
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-bottom: 1.25rem; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; text-align: center; }
    .kpi .v { font-size: 1.75rem; font-weight: 700; color: var(--disney-blue); }
    .kpi .l { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; margin-top: 0.25rem; letter-spacing: 0.04em; }
    .plan-stack { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.25rem; }
    .plan-row { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem 1rem; }
    .plan-row .bar { height: 6px; background: var(--disney-pending-bg); border-radius: 3px; margin: 0.5rem 0; overflow: hidden; }
    .ops-acc { display: flex; flex-direction: column; gap: 0.5rem; }
    .acc-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .acc-head { padding: 0.75rem 1rem; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--disney-blue); display: flex; justify-content: space-between; }
    .acc-body { padding: 0 1rem 0.75rem; font-size: 0.8rem; color: var(--muted); line-height: 1.55; display: none; }
    .acc-item.open .acc-body { display: block; }
    .check { list-style: none; padding-left: 0; }
    .check li { padding: 0.25rem 0; padding-left: 1rem; position: relative; }
    .check li::before { content: "•"; position: absolute; left: 0; color: var(--accent); }
    @media (max-width: 700px) { .flow-layout { grid-template-columns: 1fr; } .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
  <link rel="stylesheet" href="../shared/disney-theme.css">
  <link rel="stylesheet" href="../shared/option-layout.css">
  <link rel="stylesheet" href="../shared/integration.css">
  <link rel="stylesheet" href="../shared/jira.css">
</head>
<body>
  <header class="disney-header">
    <div>
      <a class="hub" href="../index.html">← ALL OPTIONS</a>
      <h1>Delta Gemini · QA Command Center</h1>
    </div>
    <div class="meta">ENV: STAGE · <span id="jira-meta"></span></div>
  </header>
  <nav class="tabs disney-tabs" id="tabs">
    <button class="active" data-tab="flow">E2E Flow</button>
    <button data-tab="qa">QA &amp; Coverage</button>
    <button data-tab="ops">Business Ops</button>
  </nav>
  <main id="app" class="disney-main">
    <section class="panel active" data-panel="flow">
      <div class="health-strip" id="health"></div>
      <div class="flow-layout">
        <div class="pipeline" id="pipeline"></div>
        <div class="detail-box" id="detail"><p style="color:var(--muted)">Select pipeline node →</p></div>
      </div>
      <p style="font-size:0.7rem;color:var(--muted);margin:1rem 0 0.5rem;text-transform:uppercase;">CPD Integration Handoffs</p>
      <div class="cpd-int-strip" id="flow-int-strip"></div>
      <div class="cpd-int-detail" id="flow-int-detail"></div>
    </section>
    <section class="panel" data-panel="qa">
      <div id="exec-kpis"></div>
      <div class="kpi-grid" id="kpis"></div>
      <div class="plan-stack" id="plans"></div>
      <p style="font-size:0.7rem;color:var(--muted);margin-bottom:0.5rem;text-transform:uppercase;">CPD Integration Coverage</p>
      <div class="cpd-int-kpi-row" id="int-kpis" style="margin-bottom:1rem"></div>
      <div class="matrix-wrap" style="margin-bottom:1.25rem"><div id="int-matrix"></div></div>
      <p style="font-size:0.7rem;color:var(--muted);margin-bottom:0.5rem;text-transform:uppercase;">Application Coverage Heatmap</p>
      <div class="matrix-wrap"><div id="app-matrix"></div></div>
    </section>
    <section class="panel" data-panel="ops">
      <div class="ops-acc" id="ops"></div>
    </section>
  </main>
  <script src="../shared/data.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="../shared/jira.js"></script>
  <script src="../shared/metrics.js"></script>
  <script src="../shared/matrix-store.js"></script>
  <script src="../shared/integration.js"></script>
  <script>
    const order = ["rightsline", "md", "fda", "cpm", "xavier", "falcon", "streaming"];
    function healthClass(s) { return s === "completed" ? "ok" : s === "in-progress" ? "warn" : "pend"; }

    function renderFlow() {
      document.getElementById("health").innerHTML = order.filter((id) => !stepById(id).branch || id === "cpm" || id === "xavier").slice(0,5).map((id) => {
        const s = stepById(id);
        if (id === "cpm" || id === "xavier") return "";
        return `<span class="${healthClass(s.status)}">${escapeHtml(s.name)}: ${escapeHtml(statusLabel(s.status))}</span>`;
      }).join("");
      document.getElementById("pipeline").innerHTML = order.map((id) => {
        const s = stepById(id);
        return `<div class="pipe-node" data-id="${id}"><div class="nm">${escapeHtml(s.name)}</div><div style="color:var(--muted);font-size:0.72rem">${escapeHtml(s.short)} · ${escapeHtml(statusLabel(s.status))}</div></div>`;
      }).join("");
      document.querySelectorAll(".pipe-node").forEach((el) => {
        el.addEventListener("click", () => {
          document.querySelectorAll(".pipe-node").forEach((n) => n.classList.remove("active"));
          el.classList.add("active");
          const s = stepById(el.dataset.id);
          document.getElementById("detail").innerHTML = `<h3>${escapeHtml(s.name)}</h3><ul>${s.requirements.map((r) => `<li>${escapeHtml(r)}</li>`).join("")}</ul>`;
        });
      });
      document.querySelector(".pipe-node[data-id='fda']").click();
      document.getElementById("flow-int-strip").innerHTML = renderIntegrationFlowStrip();
      bindIntegrationCards(document.getElementById("flow-int-strip"), document.getElementById("flow-int-detail"));
      document.querySelectorAll(".cpd-int-strip-item").forEach((el) => {
        el.addEventListener("click", () => {
          document.getElementById("flow-int-detail").innerHTML = renderIntegrationDetail(el.dataset.intId);
        });
      });
      const firstStrip = document.querySelector(".cpd-int-strip-item");
      if (firstStrip) document.getElementById("flow-int-detail").innerHTML = renderIntegrationDetail(firstStrip.dataset.intId);
    }

    function renderQA() {
      renderQAExecutionSummary("exec-kpis");
      renderQAMatrices("int-matrix", "app-matrix", "int-kpis");
      document.getElementById("kpis").innerHTML = `
        <div class="kpi"><div class="v">${GEMINI_DATA.testPlans.length}</div><div class="l">Plans</div></div>
        <div class="kpi"><div class="v">${overallCoverage()}%</div><div class="l">Coverage</div></div>
        <div class="kpi"><div class="v">${totalPendingTests()}</div><div class="l">Pending Tests</div></div>`;
      document.getElementById("plans").innerHTML = GEMINI_DATA.testPlans.map((p) => `
        <div class="plan-row"><div style="display:flex;justify-content:space-between"><strong>${jiraLink(p.id, p.id)}</strong><span class="${statusClass(planBarStatus(p))}">${escapeHtml(statusLabel(planBarStatus(p)))} · ${p.coverage}%</span></div>
        <div style="font-size:0.7rem;color:var(--muted)">${escapeHtml(p.name)} · ${escapeHtml(p.jiraStatus || "")} · Total ${p.total}</div>
        ${renderPlanProgressBar(p)}
        ${renderPlanExecutionBar(p)}
        ${renderPlanExecutionStats(p)}</div>`).join("");
    }

    function renderOps() {
      document.getElementById("ops").innerHTML = `
        <div class="acc-item open"><div class="acc-head">Gemini Delta Checklist ▾</div><div class="acc-body"><ul class="check">${GEMINI_DATA.deltaChecklist.map((c) => `<li>${escapeHtml(c.item)}</li>`).join("")}</ul></div></div>
        <div class="acc-item"><div class="acc-head">Risks ▾</div><div class="acc-body"><ul>${GEMINI_DATA.risks.map((r) => `<li>${escapeHtml(r)}</li>`).join("")}</ul></div></div>
        <div class="acc-item"><div class="acc-head">CPD Integration Handoffs ▾</div><div class="acc-body">${renderIntegrationOpsList()}</div></div>
        <div class="acc-item"><div class="acc-head">Contacts ▾</div><div class="acc-body">${GEMINI_DATA.contacts.map((c) => `<p><strong>${escapeHtml(c.system)}:</strong> ${escapeHtml(c.owners)}</p>`).join("")}</div></div>`;
      document.querySelectorAll(".acc-head").forEach((h) => h.addEventListener("click", () => h.parentElement.classList.toggle("open")));
    }

    bootConsole(() => {
      document.getElementById("tabs").querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b === btn));
          document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.dataset.panel === btn.dataset.tab));
        });
      });
      renderFlow(); renderQA(); renderOps();
      document.getElementById("jira-meta").innerHTML = GEMINI_DATA.testPlans.map((p) => jiraLink(p.id, p.id)).join(" · ");
    });
  </script>
</body>
</html>
